name: Deploy Website

on:
  # Called by the release workflow so the site and the release stay matched;
  # manual runs stay available for fixes that need to go out immediately.
  workflow_call:
  workflow_dispatch: # allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: apps/website
        run: npm install

      - name: Build
        working-directory: apps/website
        run: npm run build
        env:
          OO_SITE: ${{ secrets.OO_SITE }}
          OO_CLIENT_TOKEN: ${{ secrets.OO_CLIENT_TOKEN }}
          OO_ORGANIZATION_ID: ${{ secrets.OO_ORGANIZATION_ID }}
          OO_ENVIRONMENT: ${{ secrets.OO_ENVIRONMENT }}

      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            apps/website/.vitepress/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/requesto/