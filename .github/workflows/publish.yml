name: Publish

on:
  # Called by the release workflow (a tag pushed with GITHUB_TOKEN does not
  # trigger tag-push workflows); also runs for manually pushed tags.
  workflow_call:
  push:
    tags: ['v*']

jobs:
  publish-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build backend, engine and CLI
        run: |
          npm run build -w requesto-backend
          npm run build -w requesto-engine
          npm run build -w @requesto/cli

      - name: Sync package version with the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --workspace @requesto/cli

      - name: Publish @requesto/cli
        run: npm publish --workspace @requesto/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
